name: Publicar instalador do NEXCORE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-nexcore
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore NEXCORE.csproj

      - name: Gerar instalador
        shell: pwsh
        run: .\criar-instalador.bat --no-pause

      - name: Publicar versão mais recente
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --cleanup-tag --yes
          }
          gh release create latest `
            installer\output\NEXCORE-Setup.exe `
            installer\output\NEXCORE-Setup.sha256 `
            --target $env:GITHUB_SHA `
            --latest `
            --title "NEXCORE (versão mais recente)" `
            --notes-file NOVIDADES.md

      - name: Publicar versão marcada
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            installer\output\NEXCORE-Setup.exe `
            installer\output\NEXCORE-Setup.sha256 `
            --title "NEXCORE $env:GITHUB_REF_NAME" `
            --generate-notes `
            --latest=false
